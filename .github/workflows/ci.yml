name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings -W clippy::cargo -W clippy::perf
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check C/C++ header
        if: matrix.os == 'ubuntu-latest'
        run: |
          cc -fsyntax-only -std=c11 -Wall -Wextra -Wpedantic -Werror -x c include/viahop.h
          c++ -fsyntax-only -std=c++17 -Wall -Wextra -Wpedantic -Werror -x c++ include/viahop.h
      - run: cargo test --release
