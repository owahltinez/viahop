[package]
name = "viahop"
version = "0.1.0"
edition = "2024"
description = "Fast, standalone, zero-dependency headless Specctra DSN/SES multi-layer PCB autorouter"
license = "MIT"
readme = "README.md"
repository = "https://github.com/owahltinez/viahop"
keywords = ["pcb", "autorouter", "kicad", "specctra", "eda"]
categories = ["command-line-utilities", "science", "hardware-support"]

[lib]
name = "viahop"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "viahop"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
